<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- 內容安全政策（2026-10-07 資安審查 M1）：只允許本站與 Firebase 的腳本，不允許行內腳本與 onerror= 之類的屬性；
     只能連到 Firebase 與 Anthropic API。Firebase 在無法用 WebSocket 時會改用長輪詢載入腳本，所以 script-src 也要列出資料庫網域。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://*.firebasedatabase.app https://*.firebaseio.com; connect-src 'self' https://api.anthropic.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseio.com wss://*.firebaseio.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src https://*.firebasedatabase.app https://*.firebaseio.com; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
